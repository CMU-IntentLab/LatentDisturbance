# LUCID latent safety filter, Block Pouring (released: 400k updates).
base: [../../latentdisturbance/configs/default.yaml, wm.yaml]
task: block_pouring
remark: block_pouring
logdir: logs/block_pouring/reach
wm_checkpoint: checkpoints/block_pouring/wm.pt

failure_heads: {failure: 0.7}
margin_scale: 1.0
epistemic_margin: ensemble
epistemic_threshold: 3.4
epistemic_band: 0.4
epistemic_shape: step

use_disturbance: True
disturbance_mode: pessimistic
rollout_mode: pessimistic
kl_radius: 1.5                # calibrated: update from latentdisturbance.calibrate
kl_overbound_mult: 10.0
aps_bound: 0.95
use_ood_constraint: True
ood_threshold: 140.0          # calibrated: update from latentdisturbance.calibrate
ood_penalty_coeff: 200.0
disturbance_warmup: 2000
entropy_in_q_target: False

policy_action_dim: 6          # end-effector delta pose; the gripper is replayed from data
replay_last_action: True
replay_action: same
actor_lr: 1e-3
critic_lr: 1e-3
disturbance_lr: 1e-3
actor_update_freq: 8
critic_update_freq: 1
disturbance_update_freq: 2
gamma_anneal: True
memory_capacity: 1000000
batch_size: 16
batch_length: 64
max_ep_steps: 50
updates_per_step: 1
max_updates: 400000
check_period: 20000
